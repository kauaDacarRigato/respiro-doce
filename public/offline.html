<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#141416" />
    <meta name="robots" content="noindex" />
    <title>Sem conexão — Respiro Doce</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #141416;
        color: #f4f4f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }
      main {
        max-width: 440px;
      }
      img {
        width: 80px;
        height: 80px;
        border-radius: 22px;
      }
      small {
        display: block;
        color: #65d77c;
        letter-spacing: 0.13em;
        margin-top: 24px;
      }
      h1 {
        font-size: 32px;
        line-height: 1.15;
      }
      p {
        color: #b7b7bf;
        line-height: 1.65;
      }
      button,
      a {
        font: inherit;
      }
      button {
        margin-top: 12px;
        padding: 14px 20px;
        border: 0;
        border-radius: 12px;
        background: #65d77c;
        color: #102516;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid white;
        outline-offset: 4px;
      }
      #status {
        min-height: 26px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/app.svg" alt="" /><small>RESPIRO DOCE</small>
      <h1>Precisamos de uma conexão.</h1>
      <p>
        Não foi possível acessar o aplicativo. Confira o Wi-Fi ou os dados móveis e tente novamente.
      </p>
      <p>
        Vendas, gastos e alterações precisam da confirmação do servidor. Esta tela não registra nem
        reenvia operações.
      </p>
      <button id="retry" type="button">Tentar novamente</button>
      <p id="status" role="status"></p>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", () => {
        if (navigator.onLine) {
          location.reload();
        } else {
          document.getElementById("status").textContent =
            "O aparelho continua sem conexão. Ative o Wi-Fi ou os dados móveis.";
        }
      });
      window.addEventListener("online", () => {
        document.getElementById("status").textContent =
          "Conexão detectada. Toque em Tentar novamente.";
      });
    </script>
  </body>
</html>
